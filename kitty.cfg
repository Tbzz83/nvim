# ~/.config/kitty/kitty.conf
#term xterm-256color

# Makes the surrounding window dark
linux_display_server x11 
font_family      GeistMono Nerd Font 
font_size        11
# =============================================================================
# Color scheme
# =============================================================================
# vim:ft=kitty

## name:     Everforest Light Medium
## author:   sainnhe (palette) / adapted from Catppuccin Kitty layout
## license:  MIT
## upstream: https://github.com/sainnhe/everforest
## blurb:    Comfortable & pleasant green-based light theme.


# Background image
# download an image and ln -s <your_image> ~/backgrounds/active_background to point to it
#background_image ~/backgrounds/active_background
#background_tint 0.85

# The basic colors
#foreground              #cdd6f4
#background              #1e1e2e
#background              #000000
background #212121
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #5c6a72
cursor_text_color       #efebd4

# Scrollbar colors
scrollbar_handle_color  #939f91
scrollbar_track_color   #e0dcc7

# URL color when hovering with mouse
url_color               #3a94c5

# Kitty window border colors
active_border_color     #8da101
inactive_border_color   #a6b0a0
bell_border_color       #dfa000

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #fdf6e3
active_tab_background   #8da101
inactive_tab_foreground #5c6a72
inactive_tab_background #efebd4
tab_bar_background      #f2efdf

# Colors for marks (marked text in the terminal)
mark1_foreground #fdf6e3
mark1_background #3a94c5
mark2_foreground #fdf6e3
mark2_background #df69ba
mark3_foreground #fdf6e3
mark3_background #35a77c

# The 16 terminal colors

# black
color0 #5c6a72
color8 #829181

# red
color1 #f85552
color9 #f85552

# green
color2  #8da101
color10 #8da101

# yellow
color3  #dfa000
color11 #dfa000

# blue
color4  #3a94c5
color12 #3a94c5

# magenta
color5  #df69ba
color13 #df69ba

# cyan
color6  #35a77c
color14 #35a77c

# white
color7  #e0dcc7
color15 #f2efdf
