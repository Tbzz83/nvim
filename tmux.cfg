# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

set -g default-terminal "tmux-256color"

# Prefix
set -g prefix C-s

# Mouse support
set -g mouse on

# Pane switching
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Change status bar background and text color
set -g status-style bg=black,fg=white

# Change active window/tab color
set-window-option -g window-status-current-style bg=blue,fg=black

# Change inactive window/tab color
set-window-option -g window-status-style bg=yellow,fg=black

# Color of the line separating inactive panes
set -g pane-border-style fg=gray

# Color of the line separating the active pane
set -g pane-active-border-style fg=#3C3C67

